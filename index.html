<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#12141c" />
    <title>Explosive Peter</title>
    <meta name="description" content="Não tem como salvar ele." />

    <!-- O jogo existe para virar link mandado no grupo (GDD §1), então o
         preview do link é parte da entrega, não enfeite. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Explosive Peter" />
    <meta property="og:description" content="Não tem como salvar ele." />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />

    <!-- Favicon como SVG embutido: um asset a menos para o Pages servir errado. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='44' cy='62' r='33' fill='%231b1d28'/%3E%3Ccircle cx='32' cy='50' r='8' fill='%23f5f1e6' opacity='.22'/%3E%3Crect x='52' y='22' width='17' height='13' rx='3' fill='%236b6250'/%3E%3Cpath d='M62 28 C74 12 86 16 88 5' stroke='%23b9a77e' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='88' cy='5' r='8' fill='%23ffd36b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/chars.css" />
    <link rel="stylesheet" href="./src/styles/juice.css" />
  </head>
  <body class="state-boot">
    <main id="stage" aria-label="Palco">
      <!-- Efeitos que ficam ATRÁS do elenco. O portal do Pedro Maligno se abre
           atrás do Pedro (GDD §5), e um filho de #fx-layer não consegue passar
           para trás de #cast — precisa ser uma camada própria, antes dele. -->
      <div id="fx-back" aria-hidden="true"></div>

      <!-- HUD: timer + contadores -->
      <div id="hud">
        <!-- Linha fixa: não comenta a rodada, avisa que o relógio está correndo.
             Junto com a barra de baixo, são as duas únicas frases de tela
             durante a rodada — nada revela QUAL cena é antes do Pedro morrer. -->
        <p id="hud-tagline">O Pedro não tem muito tempo</p>
        <div id="timer" role="timer" aria-live="off">10</div>
        <div id="hud-stats"><span id="hud-deaths" hidden></span></div>
      </div>

      <!-- Elenco da rodada. Esvaziado e repovoado a cada COUNTDOWN (P4/I3):
           nenhum estado visual sobrevive de uma rodada para a outra. -->
      <div id="cast"></div>

      <!-- efeitos (flash, explosão, água, portal) -->
      <div id="fx-layer" aria-hidden="true"></div>

      <!-- Barra inferior: SLOGAN FIXO. Não é mais reescrito por JS a cada
           rodada — é a tese do jogo, e repeti-la sempre é a piada. -->
      <p id="message">Não tem como salvar Ele.</p>

      <!-- final da rodada. O card em si não é clicável: quem reinicia é o
           botão, e só ele. -->
      <div id="ending-card" hidden>
        <!-- Quem matou (ou salvou) o Pedro posa aqui e fala a `line` do final
             num balão. O `title` virou legenda pequena: a atração da tela é o
             personagem, não uma manchete.

             O card é uma GRADE 3×3: o texto mora sempre na célula do meio, e o
             `cast.at` do final joga o personagem numa das outras oito. Assim o
             texto fica centralizado sempre e nada precisa se sobrepor. -->
        <div id="ending-cast"></div>
        <div id="ending-text">
          <p id="ending-kicker">FINAL</p>
          <h1 id="ending-title"></h1>
          <p id="ending-count"></p>
          <!-- coleção de finais: decorativa, nunca clicável -->
          <ul id="ending-gallery" aria-label="Finais descobertos"></ul>
          <button id="ending-restart" type="button">DE NOVO</button>
        </div>
      </div>
    </main>

    <!-- ================= templates de ator ================= -->

    <!-- O RIG COMPARTILHADO. Um só, para os cinco personagens (GDD §5).
         O que varia vem de src/data/characters.js: cor, proporção, o rosto
         dentro de <g class="face">, o cabelo da frente dentro de <g class="hair"> (DENTRO da
         cabeça, para acompanhar respiração e virada de cabeça) e o acessório de
         corpo dentro de <g class="accessory">. O cabelo que cai para as costas
         vai no <g class="hair-back">, antes de todo mundo.
         Quem preenche os quatro é ui/rig.js. -->
    <template id="tpl-actor">
      <div class="actor">
        <svg class="rig" viewBox="0 0 120 180">
          <!-- .frame existe só para o --build esticar o boneco de lado sem
               bagunçar o transform-origin dos membros -->
          <g class="frame">
            <!-- CABELO DE TRÁS: primeiro filho do .frame, então cai ATRÁS do corpo e
                 dos braços. Respira junto com a cabeça por CSS (.idle-breathe), não por
                 parentesco — é o preço de um SVG não ter z-index. -->
            <g class="hair-back"></g>
            <g class="leg leg-l"><rect x="42" y="120" width="14" height="48" rx="7" /></g>
            <g class="leg leg-r"><rect x="64" y="120" width="14" height="48" rx="7" /></g>
            <g class="arm arm-l"><rect x="14" y="66" width="14" height="52" rx="7" /></g>
            <g class="arm arm-r"><rect x="92" y="66" width="14" height="52" rx="7" /></g>
            <g class="body"><rect x="30" y="62" width="60" height="66" rx="16" /></g>
            <g class="head">
              <rect class="skull" x="28" y="2" width="64" height="64" rx="32" ry="32" />
              <g class="face"></g>
              <!-- cabelo/chapéu: mora aqui porque é parte da CABEÇA -->
              <g class="hair"></g>
            </g>
            <g class="accessory"></g>
          </g>
        </svg>
      </div>
    </template>

    <!-- A BOMBA. O desenho aparece DUAS VEZES, e isso é de propósito: cada
         cópia é uma METADE recortada por clip-path (chars.css), e é o que
         permite o laser do Pedro Professor partir a bomba ao meio sem que
         nada além de um @keyframes saiba disso. As duas metades se encostam
         com uma sobra mínima, então parada ela lê como uma bomba só.

         O <g class="frame"> é obrigatório em todo rig: é o que as poses e a
         tremida animam sem saber quem está em cena. -->
    <template id="tpl-bomb">
      <div id="bomb" class="actor" data-actor="bomb">
        <svg class="rig" viewBox="0 0 100 120" aria-label="Bomba">
          <!-- O CORTE. Em coordenadas do viewBox (userSpaceOnUse), não em
               porcentagem: as duas metades têm bounding box diferente (só a de
               cima tem pavio), e porcentagem sairia desalinhada. As duas faixas
               se sobrepõem 2 unidades para não deixar fresta antes do corte. -->
          <defs>
            <clipPath id="bomb-cut-t" clipPathUnits="userSpaceOnUse">
              <path d="M-10 -20 H110 V66 L-10 86 Z" />
            </clipPath>
            <clipPath id="bomb-cut-b" clipPathUnits="userSpaceOnUse">
              <path d="M-10 84 L110 64 V140 H-10 Z" />
            </clipPath>
          </defs>
          <g class="frame">
            <g class="half half-t" clip-path="url(#bomb-cut-t)">
              <path class="fuse" d="M62 34 C74 18 86 22 88 8" />
              <circle class="spark" cx="88" cy="8" r="6" />
              <rect class="cap" x="52" y="26" width="18" height="14" rx="3" />
              <circle class="shell" cx="46" cy="76" r="38" />
              <circle class="shine" cx="32" cy="62" r="9" />
            </g>
            <g class="half half-b" clip-path="url(#bomb-cut-b)">
              <rect class="cap" x="52" y="26" width="18" height="14" rx="3" />
              <circle class="shell" cx="46" cy="76" r="38" />
              <circle class="shine" cx="32" cy="62" r="9" />
            </g>
          </g>
        </svg>
      </div>
    </template>

    <!-- O FIESTA. Não usa o rig humano — carro não tem braço nem perna — mas é
         um PERSONAGEM de verdade: characters.js aponta para este template pelo
         campo `rig`, e por isso ele ganha nick, entrada própria e pode posar
         no card de final como qualquer outro do elenco.

         O <g class="frame"> é obrigatório em todo rig: é o que as poses
         (`burnt`, `dead`) e a tremida animam sem saber quem está em cena. -->
    <template id="tpl-fiesta">
      <div class="actor" data-actor="fiesta">
        <svg class="rig" viewBox="0 0 200 112" aria-label="Fiesta">
          <g class="frame">
            <g class="lataria">
              <path class="chassi"
                    d="M12 88 V70 Q12 60 24 58 L54 56 L78 30 Q83 24 94 24 L138 24
                       Q149 24 154 31 L170 55 L182 59 Q190 62 190 72 V88
                       Q190 94 182 94 H20 Q12 94 12 88 Z" />
              <path class="vidro" d="M84 32 L98 32 L98 54 L66 55 Z" />
              <path class="vidro" d="M108 32 L136 32 Q142 32 146 38 L156 54 L108 54 Z" />
              <rect class="vinco" x="24" y="70" width="150" height="5" rx="2.5" />
              <ellipse class="farol" cx="184" cy="68" rx="7" ry="6" />
              <ellipse class="lanterna" cx="17" cy="68" rx="5" ry="6" />
            </g>
            <g class="roda roda-t">
              <circle class="pneu" cx="58" cy="92" r="18" />
              <circle class="calota" cx="58" cy="92" r="7" />
            </g>
            <g class="roda roda-d">
              <circle class="pneu" cx="150" cy="92" r="18" />
              <circle class="calota" cx="150" cy="92" r="7" />
            </g>
          </g>
        </svg>
      </div>
    </template>

    <!-- AS IAs. Um template só para as três (Claude, ChatGPT, Gemini): o que
         muda entre elas é a logo, que chega no slot <g class="accessory"> a
         partir de data/characters.js, como o rosto de qualquer personagem.
         Rig próprio porque uma logo não tem braço nem perna — mas continua
         sendo PERSONAGEM: ganha plaquinha de nick (que é o nome escrito em
         cima da logo, de graça), entrada, pose e vaga no card de final.

         O disco atrás é o halo da invocação; a cor vem de --cloth. -->
    <template id="tpl-ia">
      <div class="actor is-ia">
        <svg class="rig" viewBox="0 0 120 120">
          <g class="frame">
            <circle class="halo" cx="60" cy="60" r="54" />
            <g class="accessory"></g>
          </g>
        </svg>
      </div>
    </template>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
